name: Other idea
description: An idea for the launcher or the website.
title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what would it help with?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Launcher
        - Website
        - Something else
    validations:
      required: true
